# Render Blueprint for Artemis V2.
#
# Render → New → Blueprint → point at this repo. Everything below is created
# automatically; the four secrets marked `sync: false` are prompted for in the
# dashboard and never stored in git.
#
# Two constraints this file encodes, both load-bearing (see DEPLOY.md):
#   1. ONE instance. The job registry, build queue, and rate limiter are all
#      in-process. A second instance would have its own copy of each, so
#      concurrency caps and rate limits would silently double and jobs would
#      404 for whichever instance didn't run them.
#   2. A persistent disk at /data. The search cache and the Brave quota counter
#      live there. Without it every restart re-pays for search results already
#      bought. NOTE: disks require a paid instance type; the free tier has none.
#
# The GRAPH itself lives in Postgres (DATABASE_URL), not on that disk. Two
# reasons, both learned the hard way:
#   - Concurrency. Expansion runs several writers at once and SQLite serializes
#     them behind a single write lock; losing that race silently DROPPED
#     discovered nodes, which shows up as a /connect that reports "no path"
#     between two people who are in fact connected.
#   - Durability. A Render disk is tied to one paid instance. Postgres survives
#     instance replacement, plan changes and redeploys, and can be backed up
#     and inspected independently of the app.
services:
  - type: web
    name: artemis
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter          # smallest plan that supports a persistent disk
    region: oregon         # move closer to you if it matters
    numInstances: 1        # see (1) above — do not scale out
    healthCheckPath: /healthz   # stays reachable even when ARTEMIS_ACCESS_TOKEN is set
    autoDeploy: true

    disk:
      name: artemis-data
      mountPath: /data
      sizeGB: 3            # the search cache is the biggest consumer

    envVars:
      # --- secrets: prompted once in the dashboard, never committed --------
      # Without this the app is wide open and every build spends money.
      - key: ARTEMIS_ACCESS_TOKEN
        sync: false
      # Enables the Claude entity filter + relationship classifier. Absent,
      # both no-op and the graph falls back to spaCy extraction.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Primary web search. Absent, routing falls back to Brave then DuckDuckGo.
      - key: SERPER_API_KEY
        sync: false
      - key: BRAVE_API_KEY
        sync: false

      # The graph database. Paste your Supabase connection string here when
      # the dashboard prompts (Project → Connect → URI). Notes that matter:
      #   - Use the DIRECT connection on port 5432, not the transaction pooler
      #     on 6543. Graph writes rely on SAVEPOINTs inside multi-statement
      #     transactions, which is session-level behaviour.
      #   - A `postgres://` string is fine; the app rewrites the scheme that
      #     SQLAlchemy dropped (see config._normalize_db_url).
      #   - The schema builds itself on first boot. There is no migration step.
      # Leave this unset and the app falls back to a SQLite file in the
      # container — which works, but is ephemeral and loses the concurrency
      # guarantees above. Do not ship that.
      - key: DATABASE_URL
        sync: false

      # --- state paths: must point at the mounted disk ---------------------
      # Cache + quota counter only. ARTEMIS_BOARDS_DB_URL is deliberately
      # absent: on Postgres, boards default to the same database as the graph
      # (see config.BOARDS_DB_URL), so they inherit the same durability.
      - key: ARTEMIS_CACHE_DB
        value: /data/artemis_cache.db
      - key: ARTEMIS_GRAPH_DIR
        value: /data/graphs
      - key: ARTEMIS_CACHED_GRAPHS_DIR
        value: /data/cached_graphs
